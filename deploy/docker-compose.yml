# =====================================================================
# 自助式老年综合评估对话系统 - 一键部署编排
# 服务：mysql / backend / ai-service / frontend
# 使用：docker compose up -d --build
# 首次启动会自动执行 deploy/sql 下的初始化脚本建库建表
# =====================================================================
services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: geriatric-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/seed_questions.sql:/docker-entrypoint-initdb.d/03-seed_questions.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 业务后端 (Spring Boot) ----------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: geriatric-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/geriatric_assessment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      AI_SERVICE_URL: http://ai-service:8000
      AES_KEY: ${AES_KEY:-geriatric-secret-key-please-change-32b}
      REPORT_PDF_DIR: /app/reports
    volumes:
      - report-data:/app/reports
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- AI 与语音服务 (Python FastAPI) ----------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: geriatric-ai
    restart: unless-stopped
    environment:
      LLM_ENABLED: ${LLM_ENABLED:-true}            # 默认开启大模型语义归一化；不填 key 时自动降级为词典
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}  # DeepSeek（OpenAI 兼容）
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}                # DeepSeek API Key（二选一）
      DEEP_SEEK_API_KEY: ${DEEP_SEEK_API_KEY:-}     # 或使用系统变量 DEEP_SEEK_API_KEY（推荐）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}       # 兼容旧名（无下划线）
      ASR_PROVIDER: ${ASR_PROVIDER:-browser}        # 前端浏览器语音识别，无需服务
      TTS_PROVIDER: ${TTS_PROVIDER:-browser}        # 前端浏览器语音播报
    ports:
      - "8000:8000"

  # ---------- 前端 (Vue3 + Nginx) ----------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: geriatric-frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  report-data:
